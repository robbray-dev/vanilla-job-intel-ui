<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Job Intel</title>
  </head>
  <body>
    <!-- Banner/header with navigation -->
    <header class="responsive-header">
      <h2>Job Intel</h2>
      <nav class="nav-menu">
        <ul>
          <li>Browse Jobs</li>
          <li>Analytics</li>
          <li>Profile</li>
        </ul>
        <button type="button">Logout</button>
      </nav>
    </header>

    <!-- Browse Jobs header -->
    <h1>Browse Jobs</h1>

    <!-- filter box -->
    <div id="filter">
      <h3>Filters</h3>
      <hr />

      <!-- roles filter -->
      <h3>Role</h3>
      <form action="">
        <label for="">
          <input type="checkbox" name="role" value="backend" />Backend<br />
          <input type="checkbox" name="role" value="devops" />DevOps<br />
          <input type="checkbox" name="role" value="full-stack" />Full Stack<br />
          <input type="checkbox" name="role" value="data" />Data<br />
        </label>
        <hr />

        <!-- location filter -->
        <h3>Location</h3>
        <label for="">
          <input type="checkbox" name="location" value="remote" />Remote<br />
          <input type="checkbox" name="location" value="san-fransico" />San
          Fransico<br />
          <input type="checkbox" name="location" value="new-york" />New York<br />
          <input type="checkbox" name="location" value="austin" />Austin<br />
          <input type="checkbox" name="location" value="seattle" />Seattle<br />
        </label>
        <hr />

        <!-- Remote only filter -->
        <div class="remote-only-container">
          <h3>Remote Only</h3>
          <label for="">
            <input
              id="remote-only-input"
              type="checkbox"
              name="remote-only"
              value="remote-only"
            /><br />
          </label>
        </div>
        <hr />

        <!-- salary range filter -->
        <h3>Salary Range</h3>
        <label for="min"> Min salary </label>
        <input type="text" id="min" />
        <label for="max"> Max salary </label>
        <input type="text" id="max" />
        <hr />

        <!-- skills filter -->
        <h3>Skills</h3>
        <label for="">
          <input type="checkbox" name="skill" value="aws" />AWS<br />
          <input type="checkbox" name="skill" value="java" />Java<br />
          <input type="checkbox" name="skill" value="sql" />SQL<br />
          <input type="checkbox" name="skill" value="docker" />Docker<br />
        </label>
        <button type="reset">Clear all filters</button>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
