<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Job Intel</title>
  </head>
  <body>
    <!-- Banner/header with navigation -->
    <header class="responsive-header">
      <h2>Job Intel</h2>
      <nav class="nav-menu">
        <ul>
          <li>Browse Jobs</li>
          <li>Analytics</li>
          <li>Profile</li>
        </ul>
        <button type="button">Logout</button>
      </nav>
    </header>

    <!-- Browse Jobs header -->
    <h1>Browse Jobs</h1>

    <!-- filter box -->
    <div id="filter">
      <h3>Filters</h3>
      <hr />

      <!-- roles filter -->
      <h3>Role</h3>
      <form action="">
        <!-- backend choice  -->
        <!-- labels for accessibilty and screen reader purposes -->
        <label for="backend">
          <input
            id="backend"
            type="checkbox"
            name="role"
            value="backend"
          />Backend<br />
        </label>

        <!-- devops choice -->
        <label for="devops">
          <input
            id="devops"
            type="checkbox"
            name="role"
            value="devops"
          />DevOps<br />
        </label>

        <!-- full stack choice -->
        <label for="full-stack">
          <input
            id="full-stack"
            type="checkbox"
            name="role"
            value="full-stack"
          />Full Stack<br />
        </label>

        <label for="data">
          <input id="data" type="checkbox" name="role" value="data" />Data<br />
        </label>

        <hr />

        <!-- location filter -->
        <h3>Location</h3>

        <label for="remote">
          <input
            id="remote"
            type="checkbox"
            name="location"
            value="remote"
          />Remote<br />
        </label>

        <label for="san-fransico">
          <input
            id="san-fransico"
            type="checkbox"
            name="location"
            value="san-fransico"
          />San Fransico<br />
        </label>

        <label for="new-york">
          <input
            id="new-york"
            type="checkbox"
            name="location"
            value="new-york"
          />New York<br />
        </label>

        <label for="austin">
          <input
            id="austin"
            type="checkbox"
            name="location"
            value="austin"
          />Austin<br />
        </label>

        <label for="seattle">
          <input
            id="seattle"
            type="checkbox"
            name="location"
            value="seattle"
          />Seattle<br />
        </label>
        <hr />

        <!-- Remote only filter -->

        <label id="flex-label" for="remote-only-input">
          <h3>Remote Only</h3>
          <input
            id="remote-only-input"
            type="checkbox"
            name="remote-only"
            value="remote-only"
          /><br />
        </label>

        <hr />

        <!-- salary range filter -->
        <h3>Salary Range</h3>

        <!-- min salary box -->
        <div class="master-flex">
          <div class="salary-boxes">
            <label for="min"> Min salary </label>
            <input type="text" id="min" class="salary-fields" />
          </div>

          <!-- max salary box -->
          <div class="salary-boxes">
            <label for="max"> Max salary </label>
            <input type="text" id="max" class="salary-fields" />
          </div>
        </div>
        <hr />

        <!-- skills filter -->
        <h3>Skills</h3>
        <label for="">
          <input type="checkbox" name="skill" value="aws" />AWS<br />
          <input type="checkbox" name="skill" value="java" />Java<br />
          <input type="checkbox" name="skill" value="sql" />SQL<br />
          <input type="checkbox" name="skill" value="docker" />Docker<br />
        </label>

        <hr />

        <!-- buttons grouping -->
        <div class="buttons">
          <button type="reset">Clear all filters</button>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
  </body>
</html>
